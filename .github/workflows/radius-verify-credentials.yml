# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Radius - Verify Credentials
run-name: Radius verify ${{ inputs.environment || 'aws-dev' }} [${{ inputs.radius_operation || '' }}]
on:
  workflow_dispatch:
    inputs:
      radius_operation:
        description: Radius operation identity
        required: false
        type: string
      environment:
        description: 'Environment to verify'
        required: true
        default: 'aws-dev'

permissions:
  id-token: write
  contents: read
  # Mirrors the run-rad-commands deploy workflow so the GHCR push-permission
  # check below tests the same token capability the deploy will rely on.
  packages: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment || 'aws-dev' }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS Credentials
        run: |
          aws sts get-caller-identity
          echo "✅ AWS OIDC login successful"

      - name: Verify EKS Access
        run: |
          aws eks update-kubeconfig --name "${{ vars.AWS_EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"
          kubectl cluster-info
          echo "✅ EKS cluster accessible"

      - name: Verify GHCR package push permission
        shell: bash
        env:
          GH_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_REGISTRY: ${{ vars.RADIUS_STATE_REGISTRY }}
        run: |
          set -euo pipefail
          curl() { command curl --connect-timeout 10 --max-time 30 "$@"; }
          repo_path="${STATE_REGISTRY#ghcr.io/}"
          bearer="$(curl -fsS -u "${GH_ACTOR}:${GHCR_TOKEN}" "https://ghcr.io/token?service=ghcr.io&scope=repository:${repo_path}:pull,push" | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(input).token || ""));')"
          if [[ -z "${bearer}" ]]; then
            echo "::error::Could not obtain a GHCR token for ${STATE_REGISTRY}."
            exit 1
          fi
          status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer ${bearer}" "https://ghcr.io/v2/${repo_path}/blobs/uploads/")"
          if [[ "${status}" != "202" ]]; then
            echo "::error::GITHUB_TOKEN cannot start a GHCR upload for ${STATE_REGISTRY} (HTTP ${status})."
            exit 1
          fi
          echo "GHCR_PUSH_CHECK=ok" >> "$GITHUB_ENV"
          echo "✅ GHCR accepted a non-mutating upload-session probe."
      - name: Summary
        run: |
          echo "## ✅ Credentials Verified" >> $GITHUB_STEP_SUMMARY
          echo "Environment: ${{ inputs.environment || 'aws-dev' }}" >> $GITHUB_STEP_SUMMARY
          echo "Provider: aws" >> $GITHUB_STEP_SUMMARY
          echo "GHCR package push: ${GHCR_PUSH_CHECK:-unknown}" >> $GITHUB_STEP_SUMMARY
